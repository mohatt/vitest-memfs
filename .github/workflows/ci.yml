name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')) || github.event_name == 'pull_request' }}
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: |
          pnpm run test:vfs
          pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Build npm package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm pack
          tarball=$(ls -1 *.tgz)
          mv "$tarball" pkg-${{ matrix.os }}.tgz

      - name: Build npm package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          pnpm pack
          $pkg = Get-ChildItem -Filter *.tgz | Select-Object -First 1 -ExpandProperty Name
          Rename-Item $pkg "pkg-${{ matrix.os }}.tgz"

      - name: Upload Test coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ matrix.os }}
          path: pkg-${{ matrix.os }}.tgz
